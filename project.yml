name: FenShen
options:
  bundleIdPrefix: local.fenshen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  FenShen:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 分身
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "语音通话需要使用麦克风听你说话"
        NSCameraUsageDescription: "拍摄照片发给 AI 助手"
        NSSpeechRecognitionUsageDescription: "把你说的话转成文字，便于 AI 理解与回复"
        LSApplicationQueriesSchemes:
          - weixin
          - weixinulapi
          - alipay
          - alipays
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  FenShenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: FenShen
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FenShen:
    build:
      targets:
        FenShen: all
    test:
      targets:
        - FenShenTests
