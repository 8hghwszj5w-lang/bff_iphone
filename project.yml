name: FenShen
options:
  bundleIdPrefix: local.fenshen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  FenShen:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 分身
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "语音通话需要使用麦克风听你说话"
        NSCameraUsageDescription: "拍摄照片发给 AI 助手"
        NSSpeechRecognitionUsageDescription: "把你说的话转成文字，便于 AI 理解与回复"
        NSCalendarsUsageDescription: "让 AI 查看与添加日历日程"
        NSCalendarsFullAccessUsageDescription: "让 AI 查看与添加日历日程"
        NSCalendarsWriteOnlyAccessUsageDescription: "让 AI 添加日历日程"
        NSRemindersUsageDescription: "让 AI 查看与添加提醒事项"
        NSRemindersFullAccessUsageDescription: "让 AI 查看与添加提醒事项"
        LSApplicationQueriesSchemes:
          - weixin
          - weixinulapi
          - alipay
          - alipays
        # 主动消息插件：BGAppRefresh 机会性补跑到点的闹铃（系统不保证何时给时间）
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - local.fenshen.proactive.refresh
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        # 真机签名团队：此前只在 pbxproj 里手工改过，xcodegen 重新生成会丢掉；
        # 落到 project.yml 作为唯一事实源，重新生成后仍保留。
        DEVELOPMENT_TEAM: H77TRGAB7J
  FenShenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: FenShen
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FenShen:
    build:
      targets:
        FenShen: all
    test:
      targets:
        - FenShenTests
